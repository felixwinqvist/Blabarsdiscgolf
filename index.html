<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <link rel="apple-touch-icon" href="Logga.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blåbärs Discgolfklubb</title>
  <link rel="stylesheet" href="style.css?v=20260706-2">
  <script src="supabase-config.js" defer></script>
  <script src="script.js?v=20260706-2" defer></script>
</head>
<body>
  <div class="container">
    <h1 class="flytta-hoger">Blåbärs <span>Discgolfklubb</span></h1>
    <img src="Logga.png" alt="Webbplatsens logga" class="site-logo">

    
    <div class="menu">
      <a href="game.html" class="card green animate-card">
        <span class="icon card-icon"><img src="assets/icon-frisbee.png" alt="" aria-hidden="true"></span>
        <div>
          <h2>Starta nytt spel</h2>
          <p>Påbörja en ny runda discgolf</p>
        </div>
      </a>
      
      <a href="scoreboard.html" class="card gold animate-card">
        <span class="icon card-icon"><img src="assets/icon-trophy.png" alt="" aria-hidden="true"></span>
        <div>
          <h2>Leaderboard</h2>
          <p>Se dina och andras handicap</p>
        </div>
      </a>

      <a href="stats.html" class="card teal animate-card">
        <span class="icon card-icon"><img src="assets/icon-stats.png" alt="" aria-hidden="true"></span>
        <div>
          <h2>Statistik</h2>
          <p>Följ spelare, rundor och hålscore</p>
        </div>
      </a>
      
      <a href="tournament.html" class="card purple animate-card">
        <span class="icon card-icon"><img src="assets/icon-tournament.png" alt="" aria-hidden="true"></span>
        <div>
          <h2>Turnering</h2>
          <p>Delta i klubbens turneringar</p>
        </div>
      </a>
      
      <a href="course.html" class="card blue animate-card">
        <span class="icon card-icon"><img src="assets/icon-course.png" alt="" aria-hidden="true"></span>
        <div>
          <h2>Baninfo - 9 hål</h2>
          <p>Par 31 med detaljerad information</p>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
