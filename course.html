<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Baninfo - Blåbärs Discgolfklubb</title>
  <link rel="stylesheet" href="style.css?v=course-map-10" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="container course-map-page">
    <a href="index.html" class="game-back-button" aria-label="Tillbaka till start">‹</a>

    <header class="course-map-header">
      <div>
        <p class="course-kicker">Baninfo</p>
        <h1>Blåbärs 9-hålsbana</h1>
        <p class="course-location">Långö 3, 593 74 Gunnebo</p>
      </div>
      <div class="course-map-meta">
        <span>9 hål</span>
        <span>Par 31</span>
        <span>Satellitvy</span>
      </div>
    </header>

    <main class="course-map-shell">
      <section class="course-map-card">
        <div id="course-map" aria-label="Satellitkarta över banan"></div>
        <button id="reveal-course" class="map-reveal-button" type="button">
          Visa bana
        </button>
      </section>

      <aside class="course-map-panel">
        <h2>Hålkarta</h2>
        <p>Klicka på satellitbilden för att visa utkast, fairways och hål.</p>
        <div class="course-route-status" id="course-route-status">Banan är dold</div>
        <div class="hole-map-list" id="hole-map-list"></div>
      </aside>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const courseHoles = [
      { hole: 1, par: 3, length: 45, tee: [57.652554, 16.649332], basket: [57.652725, 16.649981] },
      { hole: 2, par: 4, length: 110, tee: [57.652759, 16.649879], basket: [57.653772, 16.649405] },
      { hole: 3, par: 3, length: 38, tee: [57.654013, 16.649032], basket: [57.654178, 16.649582] },
      { hole: 4, par: 3, length: 65, tee: [57.654871, 16.651130], basket: [57.654398, 16.651753] },
      { hole: 5, par: 3, length: 77, tee: [57.654571, 16.651165], basket: [57.654599, 16.652522] },
      { hole: 6, par: 3, length: 40, tee: [57.654542, 16.652649], basket: [57.654266, 16.652777] },
      { hole: 7, par: 4, length: 140, tee: [57.654341, 16.653188], basket: [57.654743, 16.651283] },
      { hole: 8, par: 4, length: 95, tee: [57.654540, 16.649829], basket: [57.653834, 16.648895] },
      { hole: 9, par: 4, length: 150, tee: [57.653877, 16.648944], basket: [57.652549, 16.649250] }
    ];

    const map = L.map('course-map', {
      zoomControl: false,
      attributionControl: true
    }).setView([57.653710, 16.651041], 17);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles © Esri'
    }).addTo(map);

    const routeLayer = L.layerGroup().addTo(map);
    const revealButton = document.getElementById('reveal-course');
    const status = document.getElementById('course-route-status');
    const holeList = document.getElementById('hole-map-list');
    const holeLayers = new Map();
    let courseVisible = false;
    let courseAnimating = false;
    let selectedHole = null;

    function createHoleIcon(hole, type) {
      return L.divIcon({
        className: `hole-map-marker ${type}`,
        html: `<span>${hole}</span>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });
    }

    function renderHoleList() {
      holeList.innerHTML = courseHoles.map((item) => `
        <button class="hole-map-item" type="button" data-hole="${item.hole}">
          <span>Hål ${item.hole}</span>
          <strong>Par ${item.par}</strong>
          <small>${item.length} m</small>
        </button>
      `).join('');

      holeList.querySelectorAll('.hole-map-item').forEach((button) => {
        button.addEventListener('click', () => {
          const hole = courseHoles.find((item) => item.hole === Number(button.dataset.hole));
          if (!courseVisible) {
            revealCourse(hole.hole);
            return;
          }

          highlightHole(hole.hole, true);
        });
      });
    }

    function addHoleToMap(hole) {
      const outline = L.polyline([hole.tee, hole.basket], {
        color: '#102033',
        weight: 7,
        opacity: 0.72,
        lineCap: 'round',
        className: 'course-line course-line-outline'
      }).addTo(routeLayer);

      const line = L.polyline([hole.tee, hole.basket], {
        color: '#ffffff',
        weight: 3,
        opacity: 0.92,
        lineCap: 'round',
        className: 'course-line course-line-main'
      }).addTo(routeLayer);

      const teeMarker = L.marker(hole.tee, { icon: createHoleIcon(hole.hole, 'tee') })
        .bindPopup(`Hål ${hole.hole} - utkast`)
        .addTo(routeLayer);

      const basketMarker = L.marker(hole.basket, { icon: createHoleIcon(hole.hole, 'basket') })
        .bindPopup(`Hål ${hole.hole} - korg, par ${hole.par}`)
        .addTo(routeLayer);

      animatePolyline(outline, 760);
      animatePolyline(line, 760);

      [outline, line, teeMarker, basketMarker].forEach((layer) => {
        layer.on('click', () => highlightHole(hole.hole, true));
      });

      holeLayers.set(hole.hole, { outline, line, teeMarker, basketMarker });
      setTimeout(() => {
        teeMarker.getElement()?.classList.add('is-visible');
        basketMarker.getElement()?.classList.add('is-visible');
      }, 220);
    }

    function animatePolyline(polyline, duration) {
      const path = polyline.getElement();
      if (!path) return;

      const length = path.getTotalLength();
      path.style.strokeDasharray = length;
      path.style.strokeDashoffset = length;
      path.getBoundingClientRect();
      path.style.transition = `stroke-dashoffset ${duration}ms cubic-bezier(.16, 1, .3, 1)`;
      path.style.strokeDashoffset = '0';

      setTimeout(() => {
        path.style.transition = '';
        path.style.strokeDasharray = '';
        path.style.strokeDashoffset = '';
      }, duration + 80);
    }

    function clearLineAnimation(polyline) {
      const path = polyline.getElement();
      if (!path) return;

      path.style.transition = '';
      path.style.strokeDasharray = '';
      path.style.strokeDashoffset = '';
    }

    function resetHoleStyles() {
      holeLayers.forEach((layers) => {
        layers.outline.setStyle({ color: '#102033', weight: 7, opacity: 0.72 });
        layers.line.setStyle({ color: '#ffffff', weight: 3, opacity: 0.92 });
        layers.teeMarker.getElement()?.classList.remove('is-active');
        layers.basketMarker.getElement()?.classList.remove('is-active');
      });

      holeList.querySelectorAll('.hole-map-item').forEach((button) => {
        button.classList.remove('is-active');
      });
    }

    function highlightHole(holeNumber, shouldZoom = false) {
      const hole = courseHoles.find((item) => item.hole === Number(holeNumber));
      const layers = holeLayers.get(Number(holeNumber));
      if (!hole || !layers) return;

      selectedHole = Number(holeNumber);
      resetHoleStyles();
      clearLineAnimation(layers.outline);
      clearLineAnimation(layers.line);

      layers.outline.setStyle({ color: '#063f4a', weight: 10, opacity: 0.9 });
      layers.line.setStyle({ color: '#5ff6d2', weight: 5, opacity: 1 });
      layers.outline.bringToFront();
      layers.line.bringToFront();
      layers.teeMarker.getElement()?.classList.add('is-active');
      layers.basketMarker.getElement()?.classList.add('is-active');

      const button = holeList.querySelector(`[data-hole="${holeNumber}"]`);
      button?.classList.add('is-active');
      button?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

      status.innerHTML = `
        <span>Markerat hål ${hole.hole}</span>
        <strong>Par ${hole.par} · ${hole.length} m</strong>
      `;

      if (shouldZoom) {
        map.fitBounds([hole.tee, hole.basket], { padding: [90, 90], maxZoom: 19 });
      }
    }

    function revealCourse(focusHole = null) {
      if (courseVisible || courseAnimating) {
        if (focusHole) {
          if (holeLayers.has(Number(focusHole))) {
            highlightHole(focusHole, true);
          } else {
            selectedHole = Number(focusHole);
          }
        }
        return;
      }

      courseAnimating = true;
      courseVisible = true;
      routeLayer.clearLayers();
      holeLayers.clear();

      const bounds = [];
      courseHoles.forEach((hole) => {
        bounds.push(hole.tee, hole.basket);
      });

      map.fitBounds(bounds, { padding: [40, 40] });
      revealButton.textContent = 'Ritar bana...';
      revealButton.disabled = true;
      status.innerHTML = '<span>Animation</span><strong>Ritar in hål 1-9</strong>';
      document.querySelector('.course-map-card').classList.add('is-revealed');

      courseHoles.forEach((hole, index) => {
        setTimeout(() => {
          addHoleToMap(hole);

          const button = holeList.querySelector(`[data-hole="${hole.hole}"]`);
          button?.classList.add('is-loaded');

          if (selectedHole === hole.hole) {
            highlightHole(hole.hole, true);
          }

          if (index === courseHoles.length - 1) {
            courseAnimating = false;
            revealButton.textContent = 'Banan visas';
            status.innerHTML = '<span>Status</span><strong>Banan visas på kartan</strong>';

            if (focusHole) {
              setTimeout(() => highlightHole(focusHole, true), 120);
            }
          }
        }, index * 260);
      });
    }

    revealButton.addEventListener('click', revealCourse);
    map.on('click', revealCourse);
    renderHoleList();
    window.addEventListener('load', () => {
      setTimeout(() => map.invalidateSize(), 150);
    });
  </script>

  <style>
    .course-map-page {
      width: min(1180px, calc(100% - 32px));
      padding-top: 28px;
    }

    .course-map-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 1rem;
      margin: 0 0 18px;
      padding-left: 56px;
      text-align: left;
    }

    .course-kicker {
      margin: 0 0 0.4rem;
      color: #0f7f92;
      font-weight: 850;
      text-transform: uppercase;
    }

    .course-location {
      margin: 0.35rem 0 0;
      color: #587086;
      font-weight: 750;
    }

    .course-map-header h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.7rem);
    }

    .course-map-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .course-map-meta span {
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: #075766;
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(15, 127, 146, 0.10);
    }

    .course-map-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 18px;
      align-items: stretch;
    }

    .course-map-card,
    .course-map-panel {
      border: 1px solid rgba(15, 127, 146, 0.16);
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(232, 249, 251, 0.72));
      box-shadow: 0 22px 55px rgba(15, 127, 146, 0.14);
      overflow: hidden;
    }

    .course-map-card {
      position: relative;
      min-height: 680px;
    }

    #course-map {
      width: 100%;
      height: 680px;
      min-height: 68vh;
      background: #d9f3f7;
    }

    #course-map img,
    .leaflet-container img,
    .leaflet-tile {
      max-width: none !important;
      padding: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      filter: none !important;
      opacity: 1 !important;
      animation: none !important;
    }

    .leaflet-marker-icon {
      width: 24px !important;
      height: 24px !important;
      border-radius: 50% !important;
    }

    .map-reveal-button {
      position: absolute;
      left: 50%;
      bottom: 28px;
      z-index: 500;
      transform: translateX(-50%);
      min-width: 180px;
      border: 0;
      white-space: nowrap;
      transition: background 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
    }

    .map-reveal-button:hover {
      transform: translateX(-50%);
    }

    .map-reveal-button:disabled {
      cursor: default;
    }

    .course-map-card.is-revealed .map-reveal-button {
      opacity: 0.92;
    }

    .course-map-panel {
      padding: 1.2rem;
      text-align: left;
    }

    .course-map-panel h2 {
      margin: 0 0 0.4rem;
      color: #075766;
    }

    .course-map-panel p {
      margin: 0 0 1rem;
    }

    .course-route-status {
      margin-bottom: 1rem;
      padding: 0.75rem 0.9rem;
      border-radius: 14px;
      background: rgba(221, 247, 239, 0.78);
      color: #0b654d;
      font-weight: 850;
    }

    .course-route-status span,
    .course-route-status strong {
      display: block;
    }

    .course-route-status span {
      color: #0f7f92;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .course-route-status strong {
      margin-top: 0.15rem;
      color: #102033;
      font-size: 1.05rem;
    }

    .hole-map-list {
      display: grid;
      gap: 0.55rem;
    }

    .hole-map-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.15rem 0.75rem;
      width: 100%;
      margin: 0;
      padding: 0.85rem;
      border: 1px solid rgba(15, 127, 146, 0.14);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.76);
      color: #102033;
      box-shadow: none;
      text-align: left;
      transition: background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .hole-map-item:hover {
      background: rgba(232, 249, 251, 0.95);
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(15, 127, 146, 0.10);
    }

    .hole-map-item.is-loaded {
      border-color: rgba(15, 127, 146, 0.28);
    }

    .hole-map-item.is-active {
      border-color: rgba(21, 150, 111, 0.72);
      background:
        linear-gradient(135deg, rgba(217, 251, 247, 1), rgba(221, 247, 239, 0.98));
      box-shadow:
        inset 4px 0 0 #15966f,
        0 16px 32px rgba(15, 127, 146, 0.18);
      transform: translateY(-1px);
    }

    .hole-map-item.is-active span {
      color: #075766;
    }

    .hole-map-item.is-active strong {
      color: #0b654d;
    }

    .hole-map-item.is-active small {
      color: #0f7f92;
    }

    .hole-map-item span,
    .hole-map-item strong {
      font-weight: 850;
    }

    .hole-map-item small {
      grid-column: 1 / -1;
      color: #587086;
      font-weight: 750;
    }

    .hole-map-marker {
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #ffffff;
      font-weight: 900;
      font-size: 0.8rem;
      box-shadow: 0 8px 20px rgba(16, 32, 51, 0.22);
      opacity: 0;
      transform: scale(0.55);
      transition: opacity 260ms ease, transform 260ms cubic-bezier(.16, 1, .3, 1), box-shadow 180ms ease;
    }

    .hole-map-marker.is-visible {
      opacity: 1;
      transform: scale(1);
    }

    .hole-map-marker.is-active {
      transform: scale(1.28);
      box-shadow:
        0 0 0 5px rgba(95, 246, 210, 0.34),
        0 14px 28px rgba(16, 32, 51, 0.28);
    }

    .course-line {
      transition: stroke 180ms ease, stroke-width 180ms ease, opacity 180ms ease;
    }

    .hole-map-marker.tee {
      background: #0f7f92;
      border: 3px solid rgba(255, 255, 255, 0.9);
    }

    .hole-map-marker.basket {
      background: #15966f;
      border: 3px solid rgba(255, 255, 255, 0.9);
    }

    @media (max-width: 900px) {
      .course-map-header {
        display: grid;
        padding-left: 54px;
      }

      .course-map-meta {
        justify-content: flex-start;
      }

      .course-map-shell {
        grid-template-columns: 1fr;
      }

      .course-map-card {
        min-height: 520px;
      }

      #course-map {
        height: 520px;
        min-height: 58vh;
      }
    }

    @media (max-width: 520px) {
      .course-map-page {
        width: min(100% - 20px, 1180px);
      }

      .course-map-header {
        padding-left: 0;
        padding-top: 54px;
        text-align: center;
      }

      .course-map-meta {
        justify-content: center;
      }

      .course-map-card,
      .course-map-panel {
        border-radius: 18px;
      }

      #course-map {
        height: 470px;
      }
    }
  </style>
</body>
</html>
