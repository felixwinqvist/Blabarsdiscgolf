<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baninfo - Blåbärs Discgolfklubb</title>
  <link rel="stylesheet" href="style.css?v=20260706-2" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="course.css?v=20260706-2" />
</head>
<body>
  <div class="container course-map-page">
    <a href="index.html" class="game-back-button" aria-label="Tillbaka till start">‹</a>

    <header class="course-map-header">
      <div>
        <p class="course-kicker">Baninfo</p>
        <h1>Blåbärs 9-hålsbana</h1>
        <p class="course-location">Långö 3, 593 74 Gunnebo</p>
      </div>
      <div class="course-map-meta">
        <span>9 hål</span>
        <span>Par 31</span>
        <span>Satellitvy</span>
      </div>
    </header>

    <main class="course-map-shell">
      <section class="course-map-card">
        <div id="course-map" aria-label="Satellitkarta över banan"></div>
        <button id="reveal-course" class="map-reveal-button" type="button">
          Visa bana
        </button>
      </section>

      <aside class="course-map-panel">
        <h2>Hålkarta</h2>
        <p>Klicka på satellitbilden för att visa utkast, fairways och hål.</p>
        <div class="course-route-status" id="course-route-status">Banan är dold</div>
        <div class="hole-map-list" id="hole-map-list"></div>
      </aside>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="course.js?v=20260706-2"></script>
</body>
</html>
