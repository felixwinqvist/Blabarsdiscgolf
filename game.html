<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starta ny runda</title>
  <link rel="stylesheet" href="style.css?v=20260706-2">
</head>
<body>
  <div class="container game-page">
    <a href="index.html" class="game-back-button" aria-label="Tillbaka till start">‹</a>

    <header class="game-hero">
      <h1>Starta ny runda</h1>
      <div class="game-summary">
        <span>9 hål</span>
        <span>Par 31</span>
        <span>Supabase</span>
      </div>
    </header>

    <main class="game-panel game-panel-simple">
      <section class="player-section" aria-labelledby="players-heading">
        <div class="section-heading">
          <div>
            <h2 id="players-heading">Välj spelare</h2>
          </div>
        </div>

        <div id="player-list">
          <!-- Dynamiskt lista på spelare -->
        </div>

        <div class="add-player-row">
          <input type="text" id="new-player" placeholder="Nytt spelarnamn" />
          <button type="button" id="add-player-button">Lägg till</button>
        </div>
      </section>

    </main>

    <button class="start-btn game-start-btn" id="start-game-button" type="button">Starta runda</button>
  </div>

  <script src="supabase-config.js"></script>
  <script src="script.js?v=20260706-2"></script>
</body>
</html>
